<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Aritmatika dengan function</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h3>Selamat datang di kalkulator Udin</h3>
    </nav>
    <div class="container">
        <h3 style="text-align: center; ">--=| Hasil |=--</h3>

        <div id="Output"></div>
        <div class="listTombol">

            <button class="tombol">C</button>
            <button class="tombol">AC</button>
            <button class="tombol">×</button>
            <button class="tombol">÷</button>
            <button class="tombol">7</button>
            <button class="tombol">8</button>
            <button class="tombol">9</button>
            <button class="tombol">+</button>
            <button class="tombol">4</button>
            <button class="tombol">5</button>
            <button class="tombol">6</button>
            <button class="tombol">-</button>
            <button class="tombol">1</button>
            <button class="tombol">2</button>
            <button class="tombol">3</button>
            <button class="tombol row-span-2">=</button>
            <button class="tombol spesial">0</button>
        </div>
    </div>

    <div id="containerError" class="backgroundHitam hilang">
        <div id="Error" class="error">
            <h3>Peringatan</h3>
            <p>Maaf terjadi error, silahkan input data dengan benar</p>
            <button onclick="notif()">OK</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
